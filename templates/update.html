{% extends 'base.html' %}

{% block head %}
<title>Recipe Scraper</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1 style="text-align: center;">Update Recipe</h1>

    <form action="/update/{{recipe.id}}" method="POST">
        <input type="url" name="content" id="content" value="{{recipe.content}}">
        <input type="submit" value="Update">
    </form>
</div>
{% endblock %}
