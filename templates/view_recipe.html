{% extends 'base.html' %}

{% block head %}
<title>Recipe Master</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1 style="text-align: center;">Recipe {{recipe.content}}</h1>

    <!-- <form action="/view_ingredient/{{recipe.id}}" method="GET">
        <input type="url" name="content" id="content" value="{{recipe.content}}">
        <input type="submit" value="Update">
    </form> -->
    {% if ingredients|length < 1 %}
    <h4 style="text-align: center;">No ingredients!</h4>
    {% else %}
    <table>
        <tr>
            <th>Ingredients</th>
        </tr>
        {% for ingredient in ingredients %}
            <tr>
                <td>{{ ingredient.ingredient }}</td>
            </tr>
        {% endfor %}
    </table>
    {% endif %}
</div>
{% endblock %}
